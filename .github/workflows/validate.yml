name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
          # This repo has no go.sum; the workflow pins the validator version.
          cache-dependency-path: .github/workflows/validate.yml
      - name: Install skilllint
        run: go install github.com/bueti/skilllint/cmd/skilllint@v0.3.0
      - name: Validate skills
        run: skilllint lint --strict --format=github-actions skills/

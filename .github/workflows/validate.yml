name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install skilllint
        run: go install github.com/bueti/skilllint/cmd/skilllint@v0.3.0
      - name: Validate skills
        run: skilllint lint --strict --format=github-actions skills/
